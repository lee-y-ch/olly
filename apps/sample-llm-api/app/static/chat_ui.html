<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Olly 운영 챗봇</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface-variant": "#6b7b93",
            "secondary-container": "#ccfbf1",
            "surface-container-high": "#f1f5f9",
            "on-secondary": "#0f766e",
            "primary": "#7c83ff",
            "on-surface": "#0f172a",
            "surface": "#ffffff",
            "background": "#f3f6fb",
            "outline": "#94a3b8",
            "secondary": "#4ecdc4",
            "primary-container": "#e0e7ff",
            "surface-container-low": "#ffffff",
            "tertiary": "#ffd166",
            "tertiary-container": "#fff6db",
            "surface-container-lowest": "#eef4fa",
            "surface-container-highest": "#e2e8f0",
            "surface-container": "#ffffff",
            "error": "#ef4444",
            "outline-variant": "#e2e8f0",
            "error-container": "#fee2e2"
          },
          borderRadius: {
            DEFAULT: "0.75rem",
            lg: "1rem",
            xl: "1.25rem",
            full: "9999px"
          },
          spacing: {
            margin: "24px",
            unit: "4px",
            gutter: "16px",
            "container-max": "1440px"
          },
          fontFamily: {
            "label-xs": ["ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
            "data-mono": ["ui-monospace", "SFMono-Regular", "Menlo", "Consolas", "monospace"],
            "headline-lg": ["ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
            "body-lg": ["ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
            "headline-md": ["ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
            "body-md": ["ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"]
          },
          fontSize: {
            "label-xs": ["11px", { lineHeight: "1.2", fontWeight: "500" }],
            "data-mono": ["13px", { lineHeight: "1.4", fontWeight: "400" }],
            "headline-md": ["24px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "1.5", fontWeight: "400" }]
          }
        }
      }
    }

  </script>
  <style>
    :root { color-scheme: light; }
    body {
      background:
        radial-gradient(circle at top right, rgba(124, 131, 255, 0.14), transparent 24%),
        radial-gradient(circle at left center, rgba(78, 205, 196, 0.12), transparent 30%),
        linear-gradient(180deg, #f3f6fb 0%, #eef4fa 100%);
      color: #0f172a;
      margin: 0;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    .sidebar-shell {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(22px);
      box-shadow: 12px 0 32px rgba(59, 73, 110, 0.06);
    }
    .brand-panel {
      position: relative;
      overflow: hidden;
    }
    .brand-panel > h1,
    .brand-panel > p {
      display: none;
    }
    .brand-panel::after {
      content: "";
      position: absolute;
      inset: auto -48px -48px auto;
      width: 140px;
      height: 140px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.18), transparent 70%);
    }
    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .brand-mark {
      position: relative;
      width: 3rem;
      height: 3rem;
      border-radius: 1rem;
      background: linear-gradient(135deg, rgba(129, 140, 248, 0.28), rgba(45, 212, 191, 0.2));
      border: 1px solid rgba(129, 140, 248, 0.24);
      box-shadow: inset 0 1px 0 rgba(248, 250, 252, 0.08);
    }
    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 0.65rem;
      right: 0.65rem;
      border-radius: 9999px;
    }
    .brand-mark::before {
      top: 0.95rem;
      height: 0.2rem;
      background: linear-gradient(90deg, #818cf8 0%, #2dd4bf 100%);
      box-shadow: 0 0 16px rgba(129, 140, 248, 0.45);
    }
    .brand-mark::after {
      top: 1.55rem;
      height: 0.42rem;
      border: 2px solid rgba(248, 250, 252, 0.72);
      border-left-color: transparent;
      border-right-color: transparent;
      opacity: 0.9;
    }
    .scenario-button,
    .question-button,
    .bubble-assistant,
    .bubble-user,
    .meta-bar,
    .icon-button {
      border-color: #e2e8f0 !important;
      box-shadow: 0 18px 40px rgba(59, 73, 110, 0.08);
    }
    .scenario-button {
      border: 1px solid #e2e8f0;
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.84);
      color: #475569;
      transition: all 0.18s ease;
    }
    .scenario-button .flex.flex-col { min-width: 0; }
    .scenario-button .flex.flex-col span:first-child { white-space: nowrap; }
    .scenario-button:hover,
    .question-button:hover { transform: translateY(-1px); }
    .scenario-active {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(20, 184, 166, 0.1));
      color: #0f172a;
      border-color: rgba(99, 102, 241, 0.28);
      box-shadow: inset 0 0 0 1px rgba(124, 131, 255, 0.18), 0 16px 36px rgba(59, 73, 110, 0.08);
    }
    .scenario-idle { color: #64748b; }
    .question-button,
    .bubble-assistant,
    .bubble-user,
    .meta-bar,
    .input-shell {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid #e2e8f0;
      border-radius: 1.35rem;
    }
    .bubble-assistant { border-top-left-radius: 0.6rem; }
    .bubble-user { border-bottom-right-radius: 0.6rem; }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.28rem 0.65rem;
      border-radius: 9999px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
    }
    .input-shell {
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #e2e8f0;
      box-shadow: 0 16px 36px rgba(59, 73, 110, 0.08);
    }
    .input-shell:focus-within {
      border-color: rgba(99, 102, 241, 0.45);
      box-shadow: 0 0 0 3px rgba(124, 131, 255, 0.14), 0 16px 36px rgba(59, 73, 110, 0.08);
    }
    .icon-button {
      border-radius: 9999px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: inset 0 1px 0 rgba(248, 250, 252, 0.04);
    }
    .icon-button:hover { background: #f8fafc; }
    .soft-pane {
      border-radius: 1.25rem;
      border: 1px solid #e2e8f0;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 18px 40px rgba(59, 73, 110, 0.08);
    }
    /* Layout stability: fixed sidebar + centered chat content */
    .app-main {
      margin-left: 20rem;
      width: calc(100vw - 20rem);
      min-width: 0;
    }
    .top-header {
      min-width: 0;
      gap: 1rem;
    }
    .header-tabs {
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .header-tabs::-webkit-scrollbar { display: none; }
    .header-tabs a {
      white-space: nowrap;
      flex-shrink: 0;
    }
    .header-actions {
      flex-shrink: 0;
    }
    .chat-content {
      width: 100%;
      max-width: 980px;
      height: 100%;
      margin: 0 auto;
      min-width: 0;
    }
    .chat-message {
      width: fit-content;
      max-width: min(820px, 100%);
      min-width: 0;
    }
    .bubble-user,
    .bubble-assistant,
    .meta-bar {
      max-width: 100%;
    }
    .meta-bar a {
      margin-left: 0 !important;
      flex-shrink: 0;
    }
    .scenario-button {
      min-height: 64px;
    }
    .scenario-button .flex.flex-col {
      min-width: 0;
      gap: 0.15rem;
    }
    .scenario-button .scenario-title {
      white-space: nowrap;
      line-height: 1.2;
    }
    .scenario-button .scenario-desc {
      line-height: 1.25;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    @media (max-width: 1024px) {
      body { overflow: auto; }
      nav.sidebar-shell { width: 18rem; }
      .app-main {
        margin-left: 18rem;
        width: calc(100vw - 18rem);
      }
      .chat-content { max-width: 100%; }
      .scenario-button { padding-left: 0.85rem; padding-right: 0.85rem; }
    }
    @media (max-width: 820px) {
      body {
        display: block;
        height: auto;
        overflow: auto;
      }
      nav.sidebar-shell {
        position: relative;
        width: 100%;
        height: auto;
      }
      .app-main {
        margin-left: 0;
        width: 100%;
        min-height: 100vh;
      }
      .chat-shell { height: auto; min-height: 100vh; }
      .composer-sticky { position: sticky; bottom: 0; }
    }
    @media (max-width: 640px) {
      .top-header { padding-left: 1rem; padding-right: 1rem; }
      .header-actions { gap: 0.35rem; }
      .chat-message { width: 100%; }
      .bubble-user { max-width: 100%; }
    }


    /* Refined sidebar scenario navigation */
    .sidebar-shell {
      background:
        radial-gradient(circle at 18% 0%, rgba(78, 205, 196, 0.18), transparent 28%),
        radial-gradient(circle at 105% 14%, rgba(124, 131, 255, 0.12), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(248, 251, 255, 0.93));
      backdrop-filter: blur(22px);
      box-shadow: 12px 0 34px rgba(59, 73, 110, 0.07);
    }
    .brand-panel { padding-top: 1.35rem !important; padding-bottom: 1.25rem !important; }
    .brand-panel::after {
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(78, 205, 196, 0.18), transparent 68%);
    }
    .brand-mark {
      width: 2.8rem;
      height: 2.8rem;
      border-radius: 1rem;
      background:
        linear-gradient(135deg, rgba(129, 140, 248, 0.26), rgba(45, 212, 191, 0.22)),
        rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(129, 140, 248, 0.28);
      box-shadow: 0 12px 26px rgba(78, 205, 196, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }
    .brand-chip {
      padding: 0.32rem 0.68rem;
      background: rgba(99, 102, 241, 0.07);
      border-color: rgba(99, 102, 241, 0.18);
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    .sidebar-section-title {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0 0 0.65rem;
      padding: 0 0.45rem;
      color: #718096;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .sidebar-section-title::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: #4ecdc4;
      box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.12);
    }
    .scenario-list {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }
    .scenario-button {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 58px;
      gap: 0.75rem;
      padding: 0.7rem 0.82rem;
      border: 1px solid rgba(226, 232, 240, 0.95) !important;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.78);
      color: #475569;
      text-align: left;
      box-shadow: 0 10px 24px rgba(59, 73, 110, 0.055);
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
      overflow: hidden;
    }
    .scenario-button:hover {
      transform: translateY(-1px);
      border-color: rgba(124, 131, 255, 0.32) !important;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 14px 30px rgba(59, 73, 110, 0.085);
    }
    .scenario-button:focus-visible {
      outline: none;
      border-color: rgba(124, 131, 255, 0.55) !important;
      box-shadow: 0 0 0 3px rgba(124, 131, 255, 0.15), 0 14px 30px rgba(59, 73, 110, 0.085);
    }
    .scenario-icon {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: rgba(124, 131, 255, 0.1);
      color: #6366f1;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72);
    }
    .scenario-icon .material-symbols-outlined {
      font-size: 19px;
      font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
    }
    .scenario-copy {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 0.12rem;
    }
    .scenario-title {
      color: #1f2a44;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .scenario-desc {
      color: #7b8798;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 600;
      word-break: keep-all;
    }
    .scenario-active {
      background: linear-gradient(135deg, rgba(124, 131, 255, 0.14), rgba(78, 205, 196, 0.16));
      border-color: rgba(124, 131, 255, 0.3) !important;
      color: #0f172a;
      box-shadow: inset 3px 0 0 #7c83ff, 0 14px 30px rgba(59, 73, 110, 0.09);
    }
    .scenario-active .scenario-icon {
      background: linear-gradient(135deg, rgba(124, 131, 255, 0.18), rgba(78, 205, 196, 0.18));
      color: #4f46e5;
    }
    .scenario-active .scenario-title { color: #0f172a; }
    .scenario-active .scenario-desc { color: #516078; }
    .scenario-button[data-tone="error"] .scenario-icon {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }
    .scenario-button[data-tone="error"].scenario-active {
      background: linear-gradient(135deg, rgba(254, 226, 226, 0.72), rgba(255, 255, 255, 0.84));
      border-color: rgba(239, 68, 68, 0.28) !important;
      box-shadow: inset 3px 0 0 #ef4444, 0 14px 30px rgba(59, 73, 110, 0.08);
    }
    .scenario-button[data-tone="error"] .scenario-title { color: #dc2626; }

    .scenario-button.scenario-active:hover {
      background: linear-gradient(135deg, rgba(124, 131, 255, 0.14), rgba(78, 205, 196, 0.16));
      border-color: rgba(124, 131, 255, 0.3) !important;
      color: #0f172a;
      box-shadow: inset 3px 0 0 #7c83ff, 0 14px 30px rgba(59, 73, 110, 0.09);
      transform: translateY(-1px);
    }
    .scenario-button.scenario-active:hover .scenario-icon {
      background: linear-gradient(135deg, rgba(124, 131, 255, 0.18), rgba(78, 205, 196, 0.18));
      color: #4f46e5;
    }
    .scenario-button.scenario-active:hover .scenario-title { color: #0f172a; }
    .scenario-button.scenario-active:hover .scenario-desc { color: #516078; }
    .scenario-button[data-tone="error"].scenario-active:hover {
      background: linear-gradient(135deg, rgba(254, 226, 226, 0.72), rgba(255, 255, 255, 0.84));
      border-color: rgba(239, 68, 68, 0.28) !important;
      box-shadow: inset 3px 0 0 #ef4444, 0 14px 30px rgba(59, 73, 110, 0.08);
    }
    .scenario-button[data-tone="error"].scenario-active:hover .scenario-icon {
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
    }
    .question-button {
      border-radius: 0.85rem !important;
      padding: 0.58rem 0.72rem !important;
      background: rgba(255, 255, 255, 0.72) !important;
      box-shadow: 0 8px 20px rgba(59, 73, 110, 0.045) !important;
      font-size: 13px !important;
      line-height: 1.35 !important;
    }
    .question-button:hover {
      background: rgba(255, 255, 255, 0.96) !important;
      border-color: rgba(124, 131, 255, 0.3) !important;
    }
    @media (max-width: 1024px) {
      .scenario-button { min-height: 56px; padding-left: 0.72rem; padding-right: 0.72rem; }
      .scenario-icon { width: 32px; height: 32px; }
    }
  

    /* ===== Global typography scale patch =====
       Slightly larger text for chat UI readability. */
    body {
      font-size: 15px;
    }
    .font-label-xs,
    .text-label-xs {
      font-size: 12px !important;
      line-height: 1.38 !important;
    }
    .font-data-mono,
    .text-data-mono {
      font-size: 13px !important;
      line-height: 1.45 !important;
    }
    .brand-title,
    .brand-lockup h1 {
      font-size: 32px !important;
      line-height: 1.05 !important;
    }
    .brand-lockup p,
    .brand-panel > p {
      font-size: 13px !important;
      line-height: 1.45 !important;
    }
    .scenario-title {
      font-size: 15px !important;
      line-height: 1.25 !important;
    }
    .scenario-desc {
      font-size: 12px !important;
      line-height: 1.35 !important;
    }
    .scenario-button {
      min-height: 68px;
    }
    .question-button {
      font-size: 14px !important;
      line-height: 1.35 !important;
      padding: 0.62rem 0.78rem !important;
    }
    .bubble-assistant,
    .bubble-user {
      font-size: 15px !important;
      line-height: 1.6 !important;
    }
    .bubble-assistant p,
    .bubble-user p {
      font-size: 15px !important;
      line-height: 1.6 !important;
    }
    .meta-pill {
      font-size: 12px !important;
      line-height: 1.35 !important;
    }
    .meta-pill .material-symbols-outlined {
      font-size: 15px !important;
    }
    .input-shell textarea,
    .input-shell input,
    #promptInput {
      font-size: 15px !important;
      line-height: 1.5 !important;
    }
    .top-header a,
    .header-tabs a {
      font-size: 14px !important;
      line-height: 1.35 !important;
    }
    @media (max-width: 640px) {
      body { font-size: 14px; }
      .scenario-title { font-size: 14px !important; }
      .bubble-assistant,
      .bubble-user { font-size: 14px !important; }
    }

  </style>
</head>
<body class="flex h-screen w-full bg-surface-container-lowest font-body-md text-body-md">
  <nav class="sidebar-shell fixed left-0 top-0 h-full flex flex-col z-40 bg-surface-container-low border-r border-outline-variant w-80">
    <div class="brand-panel px-margin py-6 border-b border-outline-variant flex flex-col gap-unit">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1 class="font-headline-md text-headline-md text-primary font-extrabold tracking-tighter">Olly</h1>
          <p class="font-label-xs text-label-xs text-on-surface-variant mt-2">LLM 서비스 상태를 질문으로 확인</p>
        </div>
      </div>
      <h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tighter">OLLY 운영 챗봇</h1>
      <p class="font-label-xs text-label-xs text-on-surface-variant">LLM 서비스 상태를 질문으로 확인</p>
    </div>

    <div class="flex-1 overflow-y-auto py-4 flex flex-col gap-6">
      <section class="px-4">
        <h2 class="sidebar-section-title">시나리오 선택</h2>
        <div class="scenario-list" id="scenarioButtons">
          <button data-scenario="normal" data-feature="chat" class="scenario-button scenario-active" type="button">
            <span class="scenario-icon" aria-hidden="true">
              <span class="material-symbols-outlined">check_circle</span>
            </span>
            <span class="scenario-copy">
              <span class="scenario-title">일반 요청</span>
              <span class="scenario-desc">기본 상태를 확인할 때</span>
            </span>
          </button>
          <button data-scenario="slow_retrieve" data-feature="rag_qa" class="scenario-button scenario-idle" type="button">
            <span class="scenario-icon" aria-hidden="true">
              <span class="material-symbols-outlined">hourglass_top</span>
            </span>
            <span class="scenario-copy">
              <span class="scenario-title">RAG 검색 지연</span>
              <span class="scenario-desc">문서 검색이 느린 상황</span>
            </span>
          </button>
          <button data-scenario="slow_llm" data-feature="chat" class="scenario-button scenario-idle" type="button">
            <span class="scenario-icon" aria-hidden="true">
              <span class="material-symbols-outlined">speed</span>
            </span>
            <span class="scenario-copy">
              <span class="scenario-title">모델 응답 지연</span>
              <span class="scenario-desc">LLM 생성이 느린 상황</span>
            </span>
          </button>
          <button data-scenario="high_token" data-feature="summary" class="scenario-button scenario-idle" type="button">
            <span class="scenario-icon" aria-hidden="true">
              <span class="material-symbols-outlined">data_usage</span>
            </span>
            <span class="scenario-copy">
              <span class="scenario-title">토큰 과다 사용</span>
              <span class="scenario-desc">비용이 늘어나는 상황</span>
            </span>
          </button>
          <button data-scenario="error" data-feature="chat" data-tone="error" class="scenario-button scenario-idle" type="button">
            <span class="scenario-icon" aria-hidden="true">
              <span class="material-symbols-outlined">error</span>
            </span>
            <span class="scenario-copy">
              <span class="scenario-title">실패 요청</span>
              <span class="scenario-desc">에러 추적을 보여줄 때</span>
            </span>
          </button>
        </div>
      </section>

      <section class="px-4">
        <h2 class="font-label-xs text-label-xs text-on-surface-variant uppercase tracking-wider mb-2 px-2">빠른 질문</h2>
        <div class="flex flex-col gap-2 px-2">
          <button data-question="현재 상태 요약해줘" class="question-button text-left font-body-md text-body-md text-on-surface bg-surface border border-outline-variant p-2 hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">현재 상태 요약해줘</button>
          <button data-question="어제랑 비교해서 비용이 왜 늘었어?" class="question-button text-left font-body-md text-body-md text-on-surface bg-surface border border-outline-variant p-2 hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">어제랑 비교해서 비용이 왜 늘었어?</button>
          <button data-question="토큰 제일 많이 쓰는 기능 뭐야?" class="question-button text-left font-body-md text-body-md text-on-surface bg-surface border border-outline-variant p-2 hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">토큰 제일 많이 쓰는 기능 뭐야?</button>
          <button data-question="RAG가 느린 거야, 모델이 느린 거야?" class="question-button text-left font-body-md text-body-md text-on-surface bg-surface border border-outline-variant p-2 hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">RAG가 느린 거야, 모델이 느린 거야?</button>
          <button data-question="가장 느린 요청 목록 보여줘" class="question-button text-left font-body-md text-body-md text-on-surface bg-surface border border-outline-variant p-2 hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">가장 느린 요청 목록 보여줘</button>
          <button data-question="최근 알림 떠 있어?" class="question-button text-left font-body-md text-body-md text-on-surface bg-surface border border-outline-variant p-2 hover:border-primary transition-colors focus:outline-none focus:ring-1 focus:ring-primary">최근 알림 떠 있어?</button>
        </div>
      </section>
    </div>
  </nav>

  <main class="chat-shell app-main flex flex-col h-screen bg-surface-container-lowest relative">
    <header class="top-header flex justify-between items-center w-full px-margin py-unit h-16 bg-surface/80 backdrop-blur-xl border-b border-outline-variant z-10 shrink-0">
      <div class="header-tabs flex items-center gap-6 h-full">
        <a class="h-full flex items-center whitespace-nowrap text-primary font-bold border-b-2 border-primary pb-1 font-body-md text-body-md" href="/chat-ui">운영 챗봇</a>
        <a class="h-full flex items-center whitespace-nowrap text-on-surface-variant font-medium hover:bg-surface-container-high transition-colors duration-150 px-2 font-body-md text-body-md" href="/dashboard">운영자 대시보드</a>
      </div>
      <div class="header-actions flex items-center gap-4 text-primary">
        <a href="/docs" class="hover:bg-surface-container-high p-2 rounded transition-colors duration-150 active:opacity-80 active:scale-95" title="API 문서">
          <span class="material-symbols-outlined">description</span>
        </a>
        <a href="/dashboard" class="hover:bg-surface-container-high p-2 rounded transition-colors duration-150 active:opacity-80 active:scale-95" title="대시보드">
          <span class="material-symbols-outlined">query_stats</span>
        </a>
        <button id="clearChat" class="icon-button hover:bg-surface-container-high p-2 rounded transition-colors duration-150 active:opacity-80 active:scale-95" title="대화 지우기">
          <span class="material-symbols-outlined">delete</span>
        </button>
      </div>
    </header>

    <div class="flex-1 overflow-hidden p-margin pb-32">
      <div class="chat-content">
        <div id="chatHistory" class="overflow-y-auto pr-1 flex flex-col gap-6 h-full">
          <div class="flex justify-start w-full">
            <div class="chat-message flex flex-col gap-2">
              <div class="bg-surface border border-outline-variant p-4 rounded-tl-lg rounded-tr-lg rounded-br-lg">
                <div class="flex items-center gap-2 mb-2 border-b border-outline-variant pb-2">
                  <span class="material-symbols-outlined text-primary text-[18px]">smart_toy</span>
                  <span class="font-label-xs text-label-xs text-on-surface-variant">Olly 분석 도우미</span>
                </div>
                <p class="font-body-md text-body-md text-on-surface">질문을 보내면 Olly가 응답 시간, 토큰, 비용, 트레이스 ID를 함께 기록합니다. 왼쪽 시나리오를 고르거나 바로 질문해보세요.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="composer-sticky absolute bottom-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant p-4">
      <div class="input-shell max-w-4xl mx-auto flex items-end gap-2 bg-surface-container-high border border-outline-variant rounded-lg p-2 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
        <textarea id="questionInput" class="flex-1 bg-transparent border-none text-on-surface font-body-md text-body-md focus:ring-0 resize-none max-h-32 p-2 outline-none" placeholder="예: 비용이 왜 늘었어? / RAG가 느린 거야, 모델이 느린 거야?" rows="1" style="min-height:44px;"></textarea>
        <div class="flex flex-col items-end gap-1 shrink-0 p-1">
          <button id="sendButton" class="rounded-2xl bg-primary-container hover:bg-primary text-white p-3 flex items-center justify-center transition-colors shadow-lg shadow-primary/10">
            <span class="material-symbols-outlined text-[20px]">send</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const state = {
      feature: "chat",
      scenario: "normal",
      busy: false,
      lastRequestId: null,
      lastTraceId: null,
    };

    const chatHistory = document.getElementById("chatHistory");
    const questionInput = document.getElementById("questionInput");
    const sendButton = document.getElementById("sendButton");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatUsd(value) {
      return `$${Number(value || 0).toFixed(6)}`;
    }

    function scrollToBottom() {
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function setScenario(button) {
      state.scenario = button.dataset.scenario;
      state.feature = button.dataset.feature;
      document.querySelectorAll(".scenario-button").forEach((item) => {
        item.classList.remove("scenario-active");
        item.classList.add("scenario-idle");
      });
      button.classList.add("scenario-active");
      button.classList.remove("scenario-idle");
    }

    function addUserMessage(question) {
      chatHistory.insertAdjacentHTML("beforeend", `
        <div class="flex justify-end w-full">
          <div class="bubble-user chat-message p-4 rounded-tl-lg rounded-tr-lg rounded-bl-lg">
            <p class="font-body-md text-body-md text-on-surface">${escapeHtml(question)}</p>
          </div>
        </div>
      `);
      scrollToBottom();
    }

    function addLoading() {
      const id = `loading-${Date.now()}`;
      chatHistory.insertAdjacentHTML("beforeend", `
        <div id="${id}" class="flex justify-start w-full">
          <div class="bg-surface border border-outline-variant p-4 rounded-tl-lg rounded-tr-lg rounded-br-lg w-64">
            <div class="flex gap-2 items-center">
              <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay:0ms"></div>
              <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay:150ms"></div>
              <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay:300ms"></div>
            </div>
          </div>
        </div>
      `);
      scrollToBottom();
      return id;
    }

    function metadataBar(data) {
      const totalTokens = Number(data.input_tokens || 0) + Number(data.output_tokens || 0);
      const latencyClass = Number(data.latency_ms || 0) >= 1000 ? "bg-tertiary-container/20 border border-tertiary px-1 rounded text-tertiary" : "text-secondary";
      const statusBadge = data.status === "error"
        ? '<div class="flex items-center gap-1 bg-error-container/20 border border-error px-1 rounded"><span class="font-label-xs text-label-xs text-error">상태:</span><span class="font-data-mono text-data-mono text-error font-medium">ERROR</span></div>'
        : "";
      return `
        <div class="bg-surface-container-high border border-outline-variant px-3 py-2 flex flex-wrap items-center gap-x-4 gap-y-2 rounded">
          ${statusBadge}
          <div class="flex items-center gap-1"><span class="font-label-xs text-label-xs text-on-surface-variant">요청:</span><span class="font-data-mono text-data-mono text-on-surface">${escapeHtml(data.request_id)}</span></div>
          <div class="flex items-center gap-1"><span class="font-label-xs text-label-xs text-on-surface-variant">트레이스:</span><span class="font-data-mono text-data-mono text-on-surface">${escapeHtml(data.trace_id)}</span></div>
          <div class="flex items-center gap-1 ${latencyClass}"><span class="font-label-xs text-label-xs text-on-surface-variant">응답시간:</span><span class="font-data-mono text-data-mono font-medium">${Number(data.latency_ms || 0)}ms</span></div>
          <div class="flex items-center gap-1"><span class="font-label-xs text-label-xs text-on-surface-variant">토큰:</span><span class="font-data-mono text-data-mono text-on-surface">${totalTokens}</span></div>
          <div class="flex items-center gap-1"><span class="font-label-xs text-label-xs text-on-surface-variant">비용:</span><span class="font-data-mono text-data-mono text-on-surface">${formatUsd(data.cost_usd)}</span></div>
          <div class="flex items-center gap-1"><span class="font-label-xs text-label-xs text-on-surface-variant">모델:</span><span class="font-data-mono text-data-mono text-on-surface">${escapeHtml(data.model)}</span></div>
          <a href="/dashboard" class="text-primary font-label-xs text-label-xs hover:underline flex items-center gap-1 shrink-0">대시보드에서 보기 <span class="material-symbols-outlined text-[14px]">open_in_new</span></a>
        </div>
      `;
    }

    function addAssistantMessage(data) {
      const isError = data.status === "error";
      const cardClass = isError
        ? "bg-error-container/10 border border-error"
        : "bg-surface border border-outline-variant";
      const headerClass = isError
        ? "border-b border-error/30"
        : "border-b border-outline-variant";
      const icon = isError ? "error" : "smart_toy";
      const iconClass = isError ? "text-error" : "text-primary";
      const title = isError ? "실패 요청 기록" : "Olly 분석 도우미";
      const textClass = isError ? "text-error" : "text-on-surface";
      chatHistory.insertAdjacentHTML("beforeend", `
        <div class="flex justify-start w-full">
          <div class="flex flex-col gap-2 max-w-[80%]">
            <div class="${cardClass} p-4 rounded-tl-lg rounded-tr-lg rounded-br-lg">
              <div class="flex items-center gap-2 mb-2 ${headerClass} pb-2">
                <span class="material-symbols-outlined ${iconClass} text-[18px]">${icon}</span>
                <span class="font-label-xs text-label-xs ${isError ? "text-error" : "text-on-surface-variant"}">${title}</span>
              </div>
              <p class="font-body-md text-body-md ${textClass} whitespace-pre-wrap">${escapeHtml(data.answer)}</p>
            </div>
            ${metadataBar(data)}
          </div>
        </div>
      `);
      scrollToBottom();
    }

    function addErrorMessage(message) {
      chatHistory.insertAdjacentHTML("beforeend", `
        <div class="flex justify-start w-full">
          <div class="flex flex-col gap-2 max-w-[80%]">
            <div class="bg-error-container/10 border border-error p-4 rounded-tl-lg rounded-tr-lg rounded-br-lg">
              <div class="flex items-center gap-2 mb-2 border-b border-error/30 pb-2">
                <span class="material-symbols-outlined text-error text-[18px]">error</span>
                <span class="font-label-xs text-label-xs text-error">요청 실패</span>
              </div>
              <p class="font-body-md text-body-md text-error">${escapeHtml(message)}</p>
            </div>
            <div class="bg-surface-container-high border border-outline-variant px-3 py-2 flex flex-wrap items-center gap-x-4 gap-y-2 rounded">
              <div class="flex items-center gap-1 bg-error-container/20 border border-error px-1 rounded">
                <span class="font-label-xs text-label-xs text-error">상태:</span>
                <span class="font-data-mono text-data-mono text-error font-medium">ERROR</span>
              </div>
              <a href="/dashboard" class="text-primary font-label-xs text-label-xs hover:underline flex items-center gap-1 shrink-0">대시보드에서 보기 <span class="material-symbols-outlined text-[14px]">open_in_new</span></a>
            </div>
          </div>
        </div>
      `);
      scrollToBottom();
    }

    function asksAboutPreviousRequest(question) {
      if (/\breq_[0-9a-f]{8}\b/i.test(question) || /\b[0-9a-f]{16,32}\b/i.test(question)) {
        return false;
      }
      const mentionsPrevious = /(방금|직전|이전|마지막)/.test(question);
      const asksForTrace = /(요청|request|trace|트레이스|느렸|느려|지연|병목|왜)/i.test(question);
      return mentionsPrevious && asksForTrace;
    }

    function buildBackendQuestion(question) {
      if (!asksAboutPreviousRequest(question) || !state.lastRequestId) {
        return question;
      }
      return `${question}\n\n분석 대상 요청 ID: ${state.lastRequestId}`;
    }

    function rememberRequest(data, isPreviousRequestFollowup) {
      if (isPreviousRequestFollowup) return;
      if (!data?.request_id) return;
      state.lastRequestId = data.request_id;
      state.lastTraceId = data.trace_id || null;
    }

    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question || state.busy) return;
      state.busy = true;
      sendButton.disabled = true;
      addUserMessage(question);
      questionInput.value = "";
      questionInput.style.height = "44px";
      const loadingId = addLoading();
      const isPreviousRequestFollowup = asksAboutPreviousRequest(question) && Boolean(state.lastRequestId);
      const backendQuestion = buildBackendQuestion(question);
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question: backendQuestion,
            feature: state.feature,
            scenario: state.scenario,
          }),
        });
        const payload = await response.json();
        document.getElementById(loadingId)?.remove();
        if (!response.ok) {
          addErrorMessage(payload.detail || "요청 처리에 실패했습니다.");
          return;
        }
        addAssistantMessage(payload);
        rememberRequest(payload, isPreviousRequestFollowup);
      } catch (error) {
        document.getElementById(loadingId)?.remove();
        addErrorMessage(error.message || "서버에 연결하지 못했습니다.");
      } finally {
        state.busy = false;
        sendButton.disabled = false;
      }
    }

    document.querySelectorAll(".scenario-button").forEach((button) => {
      button.addEventListener("click", () => setScenario(button));
    });
    document.querySelectorAll(".question-button").forEach((button) => {
      button.addEventListener("click", () => {
        questionInput.value = button.dataset.question;
        questionInput.focus();
      });
    });
    sendButton.addEventListener("click", sendQuestion);
    questionInput.addEventListener("input", () => {
      questionInput.style.height = "44px";
      questionInput.style.height = `${Math.min(questionInput.scrollHeight, 128)}px`;
    });
    questionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendQuestion();
      }
    });
    document.getElementById("clearChat").addEventListener("click", () => {
      chatHistory.innerHTML = "";
      addAssistantMessage({
        answer: "대화 기록을 지웠습니다. 새 질문을 보내면 OLLY가 다시 관측 데이터를 기록합니다.",
        request_id: "-",
        trace_id: "-",
        latency_ms: 0,
        input_tokens: 0,
        output_tokens: 0,
        cost_usd: 0,
        model: "gemma3:1b",
      });
    });

    addUserMessage = function(question) {
      chatHistory.insertAdjacentHTML("beforeend", `
        <div class="flex justify-end w-full">
          <div class="bubble-user chat-message p-4">
            <p class="font-body-md text-body-md text-on-surface">${escapeHtml(question)}</p>
          </div>
        </div>
      `);
      scrollToBottom();
    };

    addLoading = function() {
      const id = `loading-${Date.now()}`;
      chatHistory.insertAdjacentHTML("beforeend", `
        <div id="${id}" class="flex justify-start w-full">
          <div class="bubble-assistant chat-message w-[20rem] p-4">
            <div class="flex items-center gap-3">
              <div class="flex gap-2 items-center">
                <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay:0ms"></div>
                <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay:150ms"></div>
                <div class="w-2 h-2 bg-primary rounded-full animate-bounce" style="animation-delay:300ms"></div>
              </div>
              <span class="text-sm text-on-surface-variant">Olly가 신호를 분석하고 있어요.</span>
            </div>
          </div>
        </div>
      `);
      scrollToBottom();
      return id;
    };

    metadataBar = function(data) {
      const totalTokens = Number(data.input_tokens || 0) + Number(data.output_tokens || 0);
      const latencyTone = Number(data.latency_ms || 0) >= 1000
        ? "text-tertiary border-tertiary/40"
        : "text-secondary border-secondary/30";
      const statusBadge = data.status === "error"
        ? '<div class="meta-pill text-error border-error/40"><span class="font-label-xs text-label-xs">상태</span><span class="font-data-mono text-data-mono font-medium">실패</span></div>'
        : '<div class="meta-pill text-secondary border-secondary/30"><span class="font-label-xs text-label-xs">상태</span><span class="font-data-mono text-data-mono font-medium">정상</span></div>';
      return `
        <div class="meta-bar px-3 py-3 flex flex-wrap items-center gap-x-3 gap-y-2 rounded">
          ${statusBadge}
          <div class="meta-pill"><span class="font-label-xs text-label-xs text-on-surface-variant">요청 ID</span><span class="font-data-mono text-data-mono text-on-surface">${escapeHtml(data.request_id)}</span></div>
          <div class="meta-pill"><span class="font-label-xs text-label-xs text-on-surface-variant">트레이스 ID</span><span class="font-data-mono text-data-mono text-on-surface">${escapeHtml(data.trace_id)}</span></div>
          <div class="meta-pill ${latencyTone}"><span class="font-label-xs text-label-xs text-on-surface-variant">응답 시간</span><span class="font-data-mono text-data-mono font-medium">${Number(data.latency_ms || 0)}ms</span></div>
          <div class="meta-pill"><span class="font-label-xs text-label-xs text-on-surface-variant">토큰</span><span class="font-data-mono text-data-mono text-on-surface">${totalTokens}</span></div>
          <div class="meta-pill"><span class="font-label-xs text-label-xs text-on-surface-variant">비용</span><span class="font-data-mono text-data-mono text-on-surface">${formatUsd(data.cost_usd)}</span></div>
          <div class="meta-pill"><span class="font-label-xs text-label-xs text-on-surface-variant">모델</span><span class="font-data-mono text-data-mono text-on-surface">${escapeHtml(data.model)}</span></div>
          <a href="/dashboard" class="text-primary font-label-xs text-label-xs hover:underline flex items-center gap-1 shrink-0">대시보드에서 보기 <span class="material-symbols-outlined text-[14px]">open_in_new</span></a>
        </div>
      `;
    };

    addAssistantMessage = function(data) {
      const isError = data.status === "error";
      const title = isError ? "Olly가 문제를 감지했어요." : "Olly 분석 도우미";
      const icon = isError ? "error" : "auto_awesome";
      const iconClass = isError ? "text-error" : "text-primary";
      chatHistory.insertAdjacentHTML("beforeend", `
        <div class="flex justify-start w-full">
          <div class="chat-message flex flex-col gap-2">
            <div class="bubble-assistant ${isError ? "border-error/40" : ""} p-4">
              <div class="flex items-center gap-2 mb-3 pb-2 border-b ${isError ? "border-error/20" : "border-outline-variant"}">
                <span class="material-symbols-outlined ${iconClass} text-[18px]">${icon}</span>
                <span class="font-label-xs text-label-xs ${isError ? "text-error" : "text-on-surface-variant"}">${title}</span>
              </div>
              <p class="font-body-md text-body-md ${isError ? "text-error" : "text-on-surface"} whitespace-pre-wrap">${escapeHtml(data.answer)}</p>
            </div>
            ${metadataBar(data)}
          </div>
        </div>
      `);
      scrollToBottom();
    };

    addErrorMessage = function(message) {
      addAssistantMessage({
        answer: message || "Olly가 응답을 가져오지 못했어요.",
        request_id: "-",
        trace_id: "-",
        latency_ms: 0,
        input_tokens: 0,
        output_tokens: 0,
        cost_usd: 0,
        model: "gemma3:1b",
        status: "error",
      });
    };

    document.querySelector("title").textContent = "Olly 운영 챗봇";
    questionInput.placeholder = "예: 비용이 왜 늘었어? / RAG가 느린 거야, 모델이 느린 거야?";
