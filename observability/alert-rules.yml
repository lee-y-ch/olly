groups:
  - name: olly-mvp-alerts
    rules:
      - alert: OllyHighP95Latency
        expr: histogram_quantile(0.95, sum(increase(olly_request_duration_seconds_bucket[5m])) by (le)) > 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "OLLY p95 latency is high"
          description: "p95 latency has been above 3 seconds for at least 1 minute."

      - alert: OllyErrorRateHigh
        expr: sum(increase(olly_errors_total[5m])) / clamp_min(sum(increase(olly_requests_total[5m])), 1) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "OLLY error rate is high"
          description: "Error rate has been above 5% for at least 1 minute."

      - alert: OllyTokenUsageSpike
        expr: sum(increase(olly_tokens_total[10m])) > 100
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "OLLY token usage spike"
          description: "Token usage is above the MVP demo threshold."

      - alert: OllyRagRetrieveSlow
        expr: histogram_quantile(0.95, sum(increase(olly_stage_duration_seconds_bucket{stage="retrieve"}[5m])) by (le)) > 1.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "OLLY retrieve stage is slow"
          description: "RAG retrieve p95 latency has been above 2 seconds for at least 1 minute."

      - alert: OllyLocalInferenceCostSpike
        expr: sum(increase(olly_infra_cost_usd_total[10m])) > 0.00005
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "OLLY local inference cost rate is high"
          description: "Estimated local inference cost rate is above the MVP demo threshold."
