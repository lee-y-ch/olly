global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: olly-sample-api
    metrics_path: /metrics
    static_configs:
      - targets: ["sample-llm-api:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
