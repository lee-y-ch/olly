services:
  sample-llm-api:
    build:
      context: ../apps/sample-llm-api
    container_name: olly-sample-llm-api
    environment:
      LLM_BACKEND: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3:1b
      LOCAL_COMPUTE_RESOURCE: cpu
      LOCAL_COMPUTE_HOURLY_USD: "0.05"
      OTEL_SERVICE_NAME: olly-sample-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8001:8000"
    depends_on:
      otel-collector:
        condition: service_started
      ollama-pull-gemma:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:latest
    container_name: olly-ollama
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  ollama-pull-gemma:
    image: ollama/ollama:latest
    container_name: olly-ollama-pull-gemma
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull gemma3:1b"]
    depends_on:
      - ollama

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: olly-otel-collector
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: olly-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4319:4317"

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: olly-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - sample-llm-api
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    container_name: olly-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  ollama-data:
